server:
  port: 8081
  error:
    include-message: always

#Configuracion de spring
spring:
  application:
    name: Herramientas-matutino
  #Configuracion de migracion
  flyway:
    enabled: true
    baselineVersion: 1
    locations: classpath:db/migration
    sqlMigrationSuffixes: .sql
    baselineOnMigrate: true
    sqlMigrationPrefix: V
    schemas: public
  #Configuracion de base de datos
  datasource:
    url: jdbc:postgresql://localhost:5432/practica_en_clase
    username: postgres
    password: matiasjosue2014
    driver-class-name: org.postgresql.Driver
  #Configuracion de JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true